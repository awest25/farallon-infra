#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID/qtWJQaMIHUrK5YRx9X1ggsmOX9sSsWp8cZuJUV0CT alex-farallon
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDSkR3zmqmYYeuAZCBXT7Deus/bdL85xbUW5HXV5yUyK alexander.west@viasat.com

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - nfs-common

write_files:
  - path: /opt/wireguard/docker-compose.yml
    content: |
      services:
        wireguard:
          image: lscr.io/linuxserver/wireguard:latest
          container_name: wireguard
          cap_add:
            - NET_ADMIN
            - SYS_MODULE
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            - SERVERURL=${server_url}
            - PEERS=1
            # PEERDNS=auto points peers at the container's own CoreDNS (10.13.13.1)
            # so the split-horizon Corefile below can override the public domain.
            - PEERDNS=auto
            # Force CoreDNS on. The image disables it when something else holds
            # :53; the runcmd below frees it, and this makes the choice explicit.
            - USE_COREDNS=true
            - INTERNAL_SUBNET=10.13.13.0
            - ALLOWEDIPS=0.0.0.0/0
            - LOG_CONFS=true
          volumes:
            - ./config:/config
            - /lib/modules:/lib/modules
          network_mode: host
          restart: unless-stopped

  # Split-horizon DNS for the personal domain. The router does not NAT-hairpin,
  # so LAN + VPN clients cannot reach the public IP; this makes every
  # ${domain} name resolve to the reverse proxy instead, keeping the gated apps
  # (dashboard /directory, *arr panels) reachable by domain from inside. Public
  # DNS is untouched. CoreDNS runs in the container (host networking), so it
  # answers on both 10.13.13.1 (tunnel) and the VM's LAN IP.
  # DECISION: CoreDNS template plugin over a hosts list so a single rule covers
  # the apex plus every current/future subdomain (all proxied by NPM anyway).
  - path: /opt/wireguard/coredns/Corefile
    permissions: '0600'
    content: |
      . {
          loop
          errors
          health
          template IN A ${domain} {
              answer "{{ .Name }} 60 IN A ${reverse_proxy_ip}"
          }
          forward . 1.1.1.1 1.0.0.1
          cache 30
      }

  - path: /opt/wireguard/backup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      BACKUP_DIR=/mnt/storage/backups
      CONFIG_DIR=/opt/wireguard/config
      TIMESTAMP=$(date +%Y%m%d-%H%M%S)
      mkdir -p "$BACKUP_DIR"
      tar czf "$BACKUP_DIR/wireguard-$TIMESTAMP.tar.gz" -C "$CONFIG_DIR" .
      # Keep last 7 backups
      ls -t "$BACKUP_DIR"/wireguard-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm

runcmd:
  # Enable Docker service
  - systemctl enable --now docker
  # Set sysctls required by WireGuard (can't be set in container with host networking)
  - sysctl -w net.ipv4.ip_forward=1 net.ipv4.conf.all.src_valid_mark=1
  - echo "net.ipv4.ip_forward=1" >> /etc/sysctl.d/99-wireguard.conf
  - echo "net.ipv4.conf.all.src_valid_mark=1" >> /etc/sysctl.d/99-wireguard.conf
  # Free :53 for the container's CoreDNS (host networking). Ubuntu's
  # systemd-resolved stub owns 127.0.0.53:53; disable the stub and point the
  # host at the direct upstreams so its own DNS keeps working. Must run before
  # the container starts, or the image sees :53 taken and disables CoreDNS.
  - ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf
  - mkdir -p /etc/systemd/resolved.conf.d
  - printf '[Resolve]\nDNSStubListener=no\n' > /etc/systemd/resolved.conf.d/10-disable-stub.conf
  - systemctl restart systemd-resolved
  # Keep sudo/hostname lookups fast once the stub is gone.
  - grep -q '127.0.1.1 ubuntu' /etc/hosts || echo '127.0.1.1 ubuntu' >> /etc/hosts
  # Start Wireguard via Docker Compose
  - [ sh, -c, "cd /opt/wireguard && docker compose up -d" ]
  # Install the split-horizon Corefile once the container has created /config,
  # then restart so CoreDNS loads it. linuxserver only writes a default Corefile
  # when none exists, so this override persists across restarts.
  - [ sh, -c, "for i in $(seq 1 30); do [ -d /opt/wireguard/config/coredns ] && break; sleep 2; done; install -m 600 /opt/wireguard/coredns/Corefile /opt/wireguard/config/coredns/Corefile && docker restart wireguard" ]
