#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAID/qtWJQaMIHUrK5YRx9X1ggsmOX9sSsWp8cZuJUV0CT alex-farallon
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDSkR3zmqmYYeuAZCBXT7Deus/bdL85xbUW5HXV5yUyK alexander.west@viasat.com

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - nfs-common

write_files:
  - path: /opt/wireguard/docker-compose.yml
    content: |
      services:
        wireguard:
          image: lscr.io/linuxserver/wireguard:latest
          container_name: wireguard
          cap_add:
            - NET_ADMIN
            - SYS_MODULE
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=Etc/UTC
            - SERVERURL=98.51.110.156
            - PEERS=1
            - PEERDNS=1.1.1.1
            - INTERNAL_SUBNET=10.13.13.0
            - ALLOWEDIPS=0.0.0.0/0
            - LOG_CONFS=true
          volumes:
            - ./config:/config
            - /lib/modules:/lib/modules
          network_mode: host
          restart: unless-stopped

  - path: /opt/wireguard/backup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      BACKUP_DIR=/mnt/storage/backups
      CONFIG_DIR=/opt/wireguard/config
      TIMESTAMP=$(date +%Y%m%d-%H%M%S)
      mkdir -p "$BACKUP_DIR"
      tar czf "$BACKUP_DIR/wireguard-$TIMESTAMP.tar.gz" -C "$CONFIG_DIR" .
      # Keep last 7 backups
      ls -t "$BACKUP_DIR"/wireguard-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm

runcmd:
  # Enable Docker service
  - systemctl enable --now docker
  # Set sysctls required by WireGuard (can't be set in container with host networking)
  - sysctl -w net.ipv4.ip_forward=1 net.ipv4.conf.all.src_valid_mark=1
  - echo "net.ipv4.ip_forward=1" >> /etc/sysctl.d/99-wireguard.conf
  - echo "net.ipv4.conf.all.src_valid_mark=1" >> /etc/sysctl.d/99-wireguard.conf
  # Start Wireguard via Docker Compose
  - [ sh, -c, "cd /opt/wireguard && docker compose up -d" ]
