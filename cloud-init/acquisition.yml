#cloud-config
users:
  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDSkR3zmqmYYeuAZCBXT7Deus/bdL85xbUW5HXV5yUyK alexander.west@viasat.com

package_update: true
package_upgrade: true

packages:
  - docker.io
  - docker-compose-v2
  - nfs-common

write_files:
  - path: /opt/acquisition/docker-compose.yml
    content: |
      services:
        # ======================================================================
        # VPN Gateway — all torrent traffic exits through Mullvad
        # ======================================================================
        gluetun:
          image: qmcgaw/gluetun:latest
          container_name: gluetun
          cap_add:
            - NET_ADMIN
          devices:
            - /dev/net/tun:/dev/net/tun
          environment:
            - VPN_SERVICE_PROVIDER=mullvad
            - VPN_TYPE=wireguard
            - WIREGUARD_PRIVATE_KEY=${MULLVAD_WIREGUARD_PRIVATE_KEY}
            - WIREGUARD_ADDRESSES=${MULLVAD_WIREGUARD_ADDRESSES}
          ports:
            # qBittorrent WebUI — exposed through Gluetun
            - "8080:8080"
          volumes:
            - /opt/acquisition/appdata/gluetun:/gluetun
          restart: unless-stopped

        # ======================================================================
        # qBittorrent — bound to Gluetun's network (kill-switch)
        # ======================================================================
        qbittorrent:
          image: lscr.io/linuxserver/qbittorrent:latest
          container_name: qbittorrent
          network_mode: "service:gluetun"
          depends_on:
            - gluetun
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
            - WEBUI_PORT=8080
          volumes:
            - /opt/acquisition/appdata/qbittorrent:/config
            - /mnt/storage/torrents:/data/torrents
          restart: unless-stopped

        # ======================================================================
        # Prowlarr — indexer manager (syncs to Sonarr + Radarr)
        # ======================================================================
        prowlarr:
          image: lscr.io/linuxserver/prowlarr:latest
          container_name: prowlarr
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
          volumes:
            - /opt/acquisition/appdata/prowlarr:/config
          ports:
            - "9696:9696"
          restart: unless-stopped

        # ======================================================================
        # Sonarr — TV show manager
        # ======================================================================
        sonarr:
          image: lscr.io/linuxserver/sonarr:latest
          container_name: sonarr
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
          volumes:
            - /opt/acquisition/appdata/sonarr:/config
            - /mnt/storage:/data
          ports:
            - "8989:8989"
          restart: unless-stopped

        # ======================================================================
        # Radarr — movie manager
        # ======================================================================
        radarr:
          image: lscr.io/linuxserver/radarr:latest
          container_name: radarr
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
          volumes:
            - /opt/acquisition/appdata/radarr:/config
            - /mnt/storage:/data
          ports:
            - "7878:7878"
          restart: unless-stopped

        # ======================================================================
        # Overseerr — request portal for friends/family
        # ======================================================================
        overseerr:
          image: lscr.io/linuxserver/overseerr:latest
          container_name: overseerr
          environment:
            - PUID=1000
            - PGID=1000
            - TZ=America/Los_Angeles
          volumes:
            - /opt/acquisition/appdata/overseerr:/config
          ports:
            - "5055:5055"
          restart: unless-stopped

        # ======================================================================
        # Recyclarr — syncs TRaSH Guide quality profiles to Sonarr/Radarr
        # ======================================================================
        recyclarr:
          image: ghcr.io/recyclarr/recyclarr:latest
          container_name: recyclarr
          environment:
            - TZ=America/Los_Angeles
            - RECYCLARR_CREATE_CONFIG=true
          volumes:
            - /opt/acquisition/appdata/recyclarr:/config
          restart: unless-stopped

  - path: /opt/acquisition/backup.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      BACKUP_DIR=/mnt/storage/backups
      APPDATA_DIR=/opt/acquisition/appdata
      TIMESTAMP=$(date +%Y%m%d-%H%M%S)
      mkdir -p "$BACKUP_DIR"
      tar czf "$BACKUP_DIR/acquisition-$TIMESTAMP.tar.gz" -C "$APPDATA_DIR" .
      # Keep last 7 backups
      ls -t "$BACKUP_DIR"/acquisition-*.tar.gz 2>/dev/null | tail -n +8 | xargs -r rm

runcmd:
  # Enable Docker
  - systemctl enable --now docker

  # Create appdata directories for bind mounts
  - mkdir -p /opt/acquisition/appdata/{gluetun,qbittorrent,prowlarr,sonarr,radarr,overseerr,recyclarr}

  # Create the shared storage directory structure
  - mkdir -p /mnt/storage/media/movies
  - mkdir -p /mnt/storage/media/shows
  - mkdir -p /mnt/storage/torrents/automated
  - mkdir -p /mnt/storage/torrents/manual
  - mkdir -p /mnt/storage/backups

  # Install daily backup cron (3:00 AM)
  - echo "0 3 * * * root /opt/acquisition/backup.sh" > /etc/cron.d/acquisition-backup

  # Mount NFS from Proxmox host (ensure NFS is exported on the host)
  # Uncomment and adjust once NFS is configured on your Proxmox host:
  # - echo "${PROXMOX_HOST_IP}:${STORAGE_HOST_PATH} /mnt/storage nfs defaults,_netdev 0 0" >> /etc/fstab
  # - mount -a

  # Start the acquisition stack
  - [ sh, -c, "cd /opt/acquisition && docker compose up -d" ]
